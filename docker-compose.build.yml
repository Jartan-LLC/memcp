# Runs the code in this checkout instead of a release:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait
#
# Its own project and image names keep it from replacing a release deployment's
# container, volume or image, and `pull_policy: build` keeps compose from reusing a stale
# local image.

name: memcp-checkout

services:
  memcp:
    image: memcp:checkout
    build: .
    pull_policy: build
