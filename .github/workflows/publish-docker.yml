name: Publish Docker Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned by commit SHA: a tag is mutable, and this job holds
      # packages:write. Same policy as `main` (commit 93fc173); the versions beside
      # each SHA are the ones this branch already named.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
        with:
          # Tags, not just this commit — the `latest` decision below reads them.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and repo
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # `latest` follows the highest released version, not the most recently
          # pushed tag. This repository maintains a patch line beside `main`, so a
          # v0.1.3 cut after v0.2.0 would otherwise drag `latest` backwards and
          # anyone pulling it would silently downgrade.
          highest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"
          if [ "$version" = "$highest" ]; then
            echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is not the highest tag (v$highest); leaving :latest alone"
          fi

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
