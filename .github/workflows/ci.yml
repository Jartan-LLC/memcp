name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dev extras, hook envs and the dev container Features' downloads resolve at run time,
  # so main can go red with no commit; the weekly run catches that before the next PR.
  schedule:
    - cron: "10 7 * * 1" # weekly, Monday 07:10 UTC (offset from the other weekly runs)
  workflow_dispatch:
    inputs:
      mem0_api_base:
        description: "MEM0_API_BASE for live integration tests"
        required: false
      mem0_api_key:
        description: "MEM0_API_KEY for live integration tests"
        required: false

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1

# A PR's new push cancels its old run; main's runs never cancel each other, so each
# finishes its dev container image-cache export.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # `version-file` is required: without it this action installs uv `latest`,
      # not the ci/requirements.txt pin.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # The linters and their versions live in .pre-commit-config.yaml, shared with
      # make lint; pre-commit builds its own hook envs, so this job installs no
      # project extras.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - run: uv pip install -r ci/requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e '.[dev]'
      - run: pyright

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No needs: lint, so one run reports lint and test failures together.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true
          # One cache per interpreter: the matrix legs resolve different wheels.
          cache-suffix: py${{ matrix.python-version }}

      - run: uv pip install -e '.[dev]'
      - run: pytest
        env:
          MEM0_API_BASE: ${{ inputs.mem0_api_base || secrets.MEM0_API_BASE }}
          MEM0_API_KEY: ${{ inputs.mem0_api_key || secrets.MEM0_API_KEY }}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # No enable-cache: this job installs only the pinned CI tools, and uv build builds
      # in its own isolated env.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: ci/requirements.txt

      - run: uv pip install -r ci/requirements.txt
      - run: uv build
      - run: python -m twine check dist/*

  # Advisory: an unfixable transitive advisory must not fail every run, so `check`
  # doesn't gate on this job; dependency-audit.yml tracks findings in an issue.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # Audit everything installed, dev and CI tools included, as `make check` does.
      - run: uv pip install -e '.[dev]' -r ci/requirements.txt
      - name: Audit dependencies for known CVEs
        run: pip-audit

  # A5: the conformance suite and the cross-backend round trip run against a real
  # mem0 on every pull request, with no external API secret. tests/mem0 explains how.
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: Stand up a self-contained mem0
        run: tests/mem0/up.sh

      # These skip their mem0 cases unless MEM0_API_BASE and MEM0_API_KEY are set, so
      # those cases run here.
      - name: Conformance suite and tenant isolation, mem0 included
        env:
          MEM0_API_BASE: http://127.0.0.1:8888
          MEM0_API_KEY: memcp-conformance-admin-key
        run: pytest tests/conformance tests/test_tenant_isolation.py tests/backends/test_mem0.py -v

      - name: mem0 stack logs
        if: failure()
        run: docker compose -f tests/mem0/docker-compose.yml logs --tail=300

      - name: Tear down
        if: always()
        run: tests/mem0/down.sh

  docker:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: docker build -t memcp:ci .

      - name: Verify container starts and health endpoint responds
        run: |
          printf '[[keys]]\nname = "ci"\nsecrets = ["sha256:%s"]\ngrants = [{ space = "ci-user", relation = "writer" }]\n' \
            "$(printf %s ci-token | sha256sum | cut -d' ' -f1)" > ci-keys.toml
          docker run -d --name memcp-ci \
            -e MEMCP_BACKEND=mem0 \
            -e MEM0_API_BASE=http://localhost:9999 \
            -e MEM0_API_KEY=fake \
            -e MEMCP_KEYS_FILE=/etc/memcp/keys.toml \
            -v "$PWD/ci-keys.toml:/etc/memcp/keys.toml:ro" \
            -p 8080:8080 \
            memcp:ci
          STATUS=""
          for _ in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health 2>/dev/null || true)
            if [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]; then break; fi
            sleep 1
          done
          docker logs memcp-ci
          docker rm -f memcp-ci
          if [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]; then
            echo "Health endpoint responding: $STATUS"
          else
            echo "Health endpoint failed: $STATUS"
            exit 1
          fi

      # The deployment docs/deployment.md describes, on the checkout's image.
      - name: docker-compose.yml comes up healthy and checks Host headers
        run: |
          cp .env.example .env
          grep -v "^MEMCP_BACKEND=" .env > env.partial
          if docker compose --env-file env.partial config -q 2>/dev/null; then
            echo "docker-compose.yml accepted a missing MEMCP_BACKEND"; exit 1
          fi
          compose() { docker compose -f docker-compose.yml -f docker-compose.build.yml "$@"; }
          if out=$(compose up -d --build --wait 2>&1); then
            echo "docker-compose.yml started without keys.toml"; exit 1
          fi
          grep -q "bind source path does not exist" <<<"$out" || { echo "$out"; exit 1; }
          printf '[[keys]]\nname = "ci"\nsecrets = ["sha256:%s"]\ngrants = [{ space = "ci-user", relation = "writer" }]\n' \
            "$(printf %s ci-token | sha256sum | cut -d' ' -f1)" > keys.toml
          compose up -d --build --wait
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          mcp() {
            curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" -H 'Authorization: Bearer ci-token' \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d "$init" http://127.0.0.1:8080/mcp
          }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = 200
          test "$(mcp localhost:8080)" = 200
          test "$(mcp attacker.example)" = 421

      - name: Compose logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml logs --tail=300

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      devcontainer: ${{ steps.diff.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A PR's merge commit has its base as first parent. With no base (a scheduled or
      # manual run, a failed fetch) the dev container job runs, rather than risk skipping a change.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) git fetch -q --depth=1 origin "$BEFORE" && base=$BEFORE ;;
          esac
          changed=$([ -z "${base:-}" ] || git diff --name-only "$base" HEAD)
          # Everything the dev container build reads, make install's manifests included.
          if [ -z "${base:-}" ] \
              || grep -qE -e '^\.devcontainer/' -e '^\.github/workflows/ci\.yml$' -e '^Makefile$' -e '^\.claude/settings\.json$' \
                -e '(^|/)(pyproject\.toml|requirements\.txt|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc)$' <<<"$changed"; then
            echo devcontainer=true >>"$GITHUB_OUTPUT"
          fi

  devcontainer:
    name: Dev container
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The gha cache backend reads these; devcontainers/ci doesn't pass them to buildx.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: type=gha,scope=devcontainer
          cacheTo: type=gha,mode=max,scope=devcontainer
          runCmd: bash .devcontainer/verify.sh

  check:
    if: always()
    needs: [lint, typecheck, test, build, docker, conformance, changes, devcontainer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          results=("${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}" "${{ needs.docker.result }}" "${{ needs.conformance.result }}" "${{ needs.changes.result }}" "${{ needs.devcontainer.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
