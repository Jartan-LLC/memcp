name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dependencies install unpinned on every run, so `main` can go red with no
  # change to it. Without a build that runs on `main`, the next unrelated PR is
  # what discovers the drift.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      mem0_api_base:
        description: "MEM0_API_BASE for live integration tests"
        required: false
      mem0_api_key:
        description: "MEM0_API_KEY for live integration tests"
        required: false

permissions:
  contents: read

# uv installs everything here, in place of pip. `--system` on every call would
# say the same thing at every call site, so it is set once: uv targets the
# interpreter actions/setup-python put on PATH rather than demanding a
# virtualenv.
env:
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # uv's own version is read from ci/requirements.txt, the file that pins
      # the gate's tools — so Dependabot's "/ci" entry bumps uv too, and the
      # runner, the devcontainer and the Dockerfile never drift apart. Without
      # `version-file` this action installs uv `latest`, which is the
      # unpinned-CI-tool failure JAR-278 closed. setup-uv's cache replaces
      # setup-python's `cache: pip`: it keys off pyproject.toml and
      # ci/requirements.txt, and it caches uv's own wheel store, which is what
      # the install actually reads.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"
      - run: ruff check memcp/ tests/
      - run: ruff format --check memcp/ tests/
      - run: pyright memcp/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"
      - run: pytest -x
        env:
          MEM0_API_BASE: ${{ inputs.mem0_api_base || secrets.MEM0_API_BASE }}
          MEM0_API_KEY: ${{ inputs.mem0_api_key || secrets.MEM0_API_KEY }}

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - run: docker build -t memcp:ci .

      - name: Verify container starts and health endpoint responds
        run: |
          docker run -d --name memcp-ci \
            -e MEM0_API_BASE=http://localhost:9999 \
            -e MEM0_API_KEY=fake \
            -p 8080:8080 \
            memcp:ci
          STATUS=""
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health 2>/dev/null || true)
            if [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]; then break; fi
            sleep 1
          done
          docker logs memcp-ci
          docker rm -f memcp-ci
          if [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]; then
            echo "Health endpoint responding: $STATUS"
          else
            echo "Health endpoint failed: $STATUS"
            exit 1
          fi

  check:
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          results=("${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
