name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dependencies install unpinned on every run, so `main` can go red with no
  # change to it. Without a build that runs on `main`, the next unrelated PR is
  # what discovers the drift.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      mem0_api_base:
        description: "MEM0_API_BASE for live integration tests"
        required: false
      mem0_api_key:
        description: "MEM0_API_KEY for live integration tests"
        required: false

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # `version-file` is required: without it this action installs uv `latest`,
      # not the ci/requirements.txt pin.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"
      - run: ruff check memcp/ tests/
      - run: ruff format --check memcp/ tests/
      - run: pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"
      - run: pytest -x
        env:
          MEM0_API_BASE: ${{ inputs.mem0_api_base || secrets.MEM0_API_BASE }}
          MEM0_API_KEY: ${{ inputs.mem0_api_key || secrets.MEM0_API_KEY }}
          # The mem0 half of the conformance suite belongs to the `conformance` job,
          # which stands its own mem0 up. Keeping it out of here means this job's
          # result does not depend on whether a repository secret happens to be set.
          MEMCP_CONFORMANCE_BACKENDS: in_memory

  # A5: the conformance suite and the cross-backend round trip run against a real
  # mem0 on every pull request, with no external API secret. ci/mem0 explains how.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: Stand up a self-contained mem0
        run: ci/mem0/up.sh

      - name: Conformance suite — in_memory and mem0
        env:
          MEM0_API_BASE: http://127.0.0.1:8888
          MEM0_API_KEY: memcp-conformance-admin-key
          MEMCP_CONFORMANCE_BACKENDS: in_memory,mem0
        run: python -m memcp.conformance -q --conformance-report=conformance-report.json

      # JAR-452: G7's tenant-isolation assertions and the mem0 adapter's own live
      # tests, run against the real mem0 this job already stands up. mem0 is the one
      # backend where isolation is not structural — its single-ID endpoints and
      # /entities are global on the wire, so the adapter compensates in code
      # (fetch-then-verify, post-filtering) in a way nothing else here exercises.
      - name: Tenant isolation — mem0
        env:
          MEM0_API_BASE: http://127.0.0.1:8888
          MEM0_API_KEY: memcp-conformance-admin-key
        run: pytest tests/test_tenant_isolation.py tests/test_backend_mem0.py -v

      - name: mem0 stack logs
        if: failure()
        run: docker compose -f ci/mem0/docker-compose.yml logs --tail=300

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: ci/mem0/down.sh

  # B1: the cognee half of the conformance suite, against a real cognee with a real
  # Kuzu graph and no external API secret. ci/cognee explains what the stand-in model
  # does and does not prove.
  conformance_cognee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: Stand up a self-contained cognee
        run: ci/cognee/up.sh

      - name: Conformance suite — cognee, and every round trip through it
        env:
          COGNEE_API_BASE: http://127.0.0.1:8890
          COGNEE_TENANT_SECRET: memcp-conformance-tenant-secret
          MEMCP_CONFORMANCE_BACKENDS: in_memory,sqlite,cognee
        run: |
          python -m memcp.conformance -q \
            --conformance-report=conformance-cognee-report.json

      # The claims the shared suite cannot make: that add() returns only once the
      # memory is findable, and that memory_entities answers from a graph with edges.
      - name: Graph and findability — cognee
        env:
          COGNEE_API_BASE: http://127.0.0.1:8890
          COGNEE_TENANT_SECRET: memcp-conformance-tenant-secret
        run: pytest tests/test_backend_cognee.py -v

      - name: cognee stack logs
        if: failure()
        run: docker compose -f ci/cognee/docker-compose.yml logs --tail=300

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-cognee-report
          path: conformance-cognee-report.json
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: ci/cognee/down.sh

  # C1 and C2: one command brings up memcp plus a backend on a machine with nothing
  # running, fails non-zero if it does not become healthy, and the first memory over
  # MCP is timed. This is the only place the workspace can execute it — no agent
  # runtime here has Docker access.
  provision:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, in_memory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: Plan declares the stack before anything is created
        run: python -m memcp plan --backend ${{ matrix.backend }} --dir .memcp

      - name: Nothing is running yet
        run: |
          test -z "$(docker ps -q)" || { docker ps; echo "host was not clean"; exit 1; }

      - name: memcp up
        run: |
          /usr/bin/time -f 'TIME_TO_FIRST_MEMORY_SECONDS=%e' -o timing.txt \
            python -m memcp up --backend ${{ matrix.backend }} --dir .memcp \
              --memcp-source . --smoke --timeout 600
          cat timing.txt >> "$GITHUB_STEP_SUMMARY"
          cat timing.txt

      - name: Re-running up is idempotent and keeps the memories
        run: ci/provision/idempotency.sh ${{ matrix.backend }}

      - name: No secret reached a tracked file
        run: ci/provision/no-secret-leak.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f .memcp/docker-compose.yml logs --tail=300

      - name: Teardown stops what up started
        if: always()
        run: |
          python -m memcp down --dir .memcp
          test -z "$(docker ps -q)" || { docker ps; echo "containers survived down"; exit 1; }

  # JAR-559: the same command under a platform that routes into the container, where
  # a published host port is a second way in that nothing routes. Asserts the port is
  # absent, that the external network still reaches memcp through its bearer gate,
  # and that switching the flag keeps the memories.
  provision_unpublished:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: Plan declares a deployment with no published port
        run: |
          python -m memcp plan --dir .memcp-unpublished --no-publish \
            --network memcp-ci-edge --external-url http://memcp:8080

      - name: A deployment nothing on the host can reach
        run: ci/provision/unpublished.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f .memcp-unpublished/docker-compose.yml logs --tail=300

  # C1's mem0 half. Nobody in this workspace holds an OpenAI key, so the stack is
  # pointed at the same standard-library stand-in ci/mem0 uses via --llm-base-url —
  # the option that exists so a local endpoint can replace a paid account. What this
  # proves is the provisioning path; what it does not prove is embedding quality or
  # fact extraction, which ci/mem0/README.md already states.
  provision_mem0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: A missing provider key stops the run and names it
        run: ci/provision/refuses-without-key.sh

      - name: Stand the keyless LLM endpoint up on the host
        run: |
          docker build -t memcp-ci/fake-openai:local ci/mem0/fake-openai
          docker run -d --name fake-openai -p 8000:8000 memcp-ci/fake-openai:local
          gateway="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          echo "LLM_BASE_URL=http://${gateway}:8000/v1" >> "$GITHUB_ENV"

      - name: memcp up --backend mem0
        run: |
          /usr/bin/time -f 'MEM0_PROVISION_SECONDS=%e' -o timing.txt \
            python -m memcp up --backend mem0 --dir .memcp --memcp-source . \
              --llm-base-url "$LLM_BASE_URL" --timeout 900
          cat timing.txt >> "$GITHUB_STEP_SUMMARY"
          cat timing.txt

      - name: First memory over MCP, through mem0 and pgvector
        run: python -m memcp verify --dir .memcp

      - name: Logs on failure
        if: failure()
        run: docker compose -f .memcp/docker-compose.yml logs --tail=300

      - name: Teardown
        if: always()
        run: |
          docker rm -f fake-openai || true
          python -m memcp down --dir .memcp --volumes || true

  # B3's cognee half. Nobody in this workspace holds a provider key, so the stack is
  # pointed at ci/cognee's stand-in via --llm-base-url — the option that exists so a
  # local endpoint can replace a paid account. What this proves is the provisioning
  # path and the tenant partitioning memcp's /health insists on; what it does not
  # prove is extraction or embedding quality, which ci/cognee/README.md states.
  provision_cognee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e ".[dev]"

      - name: Plan declares the stack before anything is created
        run: python -m memcp plan --backend cognee --dir .memcp

      - name: Stand the keyless model endpoint up on the host
        run: |
          docker build -t memcp-ci/cognee-fake-openai:local ci/cognee/fake-openai
          docker run -d --name cognee-fake-openai -p 8000:8000 \
            memcp-ci/cognee-fake-openai:local
          gateway="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          echo "LLM_BASE_URL=http://${gateway}:8000/v1" >> "$GITHUB_ENV"

      - name: memcp up --backend cognee
        run: |
          /usr/bin/time -f 'COGNEE_PROVISION_SECONDS=%e' -o timing.txt \
            python -m memcp up --backend cognee --dir .memcp --memcp-source . \
              --llm-base-url "$LLM_BASE_URL" --timeout 900
          cat timing.txt >> "$GITHUB_STEP_SUMMARY"
          cat timing.txt

      - name: First memory over MCP, through cognee's graph pipeline
        run: python -m memcp verify --dir .memcp

      - name: Re-running up is idempotent and keeps the memories
        run: ci/provision/idempotency.sh cognee

      - name: No secret reached a tracked file
        run: ci/provision/no-secret-leak.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f .memcp/docker-compose.yml logs --tail=300

      - name: Teardown
        if: always()
        run: |
          docker rm -f cognee-fake-openai || true
          python -m memcp down --dir .memcp --volumes || true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - run: docker build -t memcp:ci .

      - name: Verify container starts and health endpoint responds
        run: |
          docker run -d --name memcp-ci \
            -e MEM0_API_BASE=http://localhost:9999 \
            -e MEM0_API_KEY=fake \
            -e MEMCP_AUTH_TOKENS=ci-token:ci-user \
            -p 8080:8080 \
            memcp:ci
          STATUS=""
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health 2>/dev/null || true)
            if [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]; then break; fi
            sleep 1
          done
          docker logs memcp-ci
          docker rm -f memcp-ci
          if [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]; then
            echo "Health endpoint responding: $STATUS"
          else
            echo "Health endpoint failed: $STATUS"
            exit 1
          fi

  check:
    if: always()
    needs: [lint, test, conformance, conformance_cognee, provision, provision_unpublished, provision_mem0, provision_cognee, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          results=("${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.conformance.result }}" "${{ needs.conformance_cognee.result }}" "${{ needs.provision.result }}" "${{ needs.provision_unpublished.result }}" "${{ needs.provision_mem0.result }}" "${{ needs.provision_cognee.result }}" "${{ needs.build.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
