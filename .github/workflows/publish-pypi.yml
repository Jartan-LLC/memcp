name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # `enable-cache: false` stated, not defaulted: zizmor's cache-poisoning
      # audit reads the literal value on a publish path. `version-file` also
      # installs uv, which is all ci/requirements.txt pins here — so no separate
      # install step follows; add one back if a gate tool joins that file.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: false

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
