[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memcp-server"
version = "0.1.0"
description = "Backend-agnostic, multi-tenant MCP memory server"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# Every dependency carries an upper bound. CI installs unpinned on every run,
# so an unbounded floor lets an upstream major break `main` with no change here
# (mcp 2.0 removed `mcp.server.fastmcp`, which is exactly how this got found).
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2.0,<3",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "starlette>=0.27,<2",
    "uvicorn>=0.49.0,<1",
]

[project.scripts]
memcp = "memcp.__main__:main"

# Auto-loads the conformance reporter wherever memcp is installed, so
# `pytest --pyargs memcp.conformance.suite` works from an adapter's own repository.
[project.entry-points.pytest11]
memcp_conformance = "memcp.conformance.plugin"

[project.optional-dependencies]
dev = [
    "asgi-lifespan>=2.1,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
    "respx>=0.22,<1",
    "ruff>=0.15.16,<1",
    "pyright>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["memcp"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The conformance suite ships inside the package so out-of-tree adapters can run
# it; it is collected here too, so `pytest` covers every backend this repo can reach.
testpaths = ["tests", "memcp/conformance/suite"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
