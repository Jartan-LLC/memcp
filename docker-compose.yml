# memcp, running the latest release. Set MEMCP_BACKEND and MEMCP_AUTH_TOKENS in .env,
# then run `docker compose up -d --wait`.
# Guide: https://github.com/Jartan-LLC/memcp/blob/main/docs/deployment.md

name: memcp

services:
  memcp:
    image: ghcr.io/jartan-llc/memcp:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEMCP_BACKEND: ${MEMCP_BACKEND:?set MEMCP_BACKEND in .env}
      MEMCP_SQLITE_PATH: /data/memcp.sqlite3
      MEMCP_HOST: 0.0.0.0
      MEMCP_PORT: "8080"
      MEMCP_AUTH_TOKENS: ${MEMCP_AUTH_TOKENS:?set MEMCP_AUTH_TOKENS in .env}
      # DNS-rebinding protection; the SDK leaves it off on a 0.0.0.0 bind.
      MEMCP_ALLOWED_HOSTS: ${MEMCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - memcp_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

volumes:
  memcp_data:
