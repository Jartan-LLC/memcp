# memcp with the sqlite backend: durable, no API key, no other service.
#
#   cp .env.example .env    # set MEMCP_AUTH_TOKENS
#   docker compose up -d --wait
#
# Runs the latest release; set MEMCP_VERSION in .env to pin one. To run this
# checkout instead, add docker-compose.build.yml. docs/deployment.md covers the rest.

services:
  memcp:
    image: ghcr.io/jartan-llc/memcp:${MEMCP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEMCP_BACKEND: ${MEMCP_BACKEND:-sqlite}
      MEMCP_SQLITE_PATH: /data/memcp.sqlite3
      MEMCP_HOST: 0.0.0.0
      MEMCP_PORT: "8080"
      # DNS-rebinding protection; the SDK leaves it off on a 0.0.0.0 bind.
      MEMCP_ALLOWED_HOSTS: ${MEMCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
    # Loopback: unreachable from another machine unless you change this deliberately.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - memcp_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

volumes:
  memcp_data:
